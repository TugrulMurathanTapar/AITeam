[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-orchestrator"
version = "1.0.0"
description = "Cross-Platform Multi-AI Orchestrator with Portable Memory & Encrypted Sync"
requires-python = ">=3.10"
authors = [
    {name = "AI API Team"}
]
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "cryptography>=42.0",
    "pydantic>=2.5",
    "qrcode>=7.4",
    "pillow>=10.0",
    "rich>=13.0",
    "aiofiles>=23.0",
]

[project.scripts]
ai-orchestrator = "launcher.launcher:main"

[tool.setuptools.packages.find]
include = ["core*", "memory*", "skills*", "ui*", "launcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
